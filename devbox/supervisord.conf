[supervisord]
nodaemon=true
user=devbox
logfile=/tmp/supervisord.log
pidfile=/tmp/supervisord.pid
logfile_maxbytes=10MB
logfile_backups=2

[program:code-server]
command=code-server --bind-addr 0.0.0.0:8080 --user-data-dir /home/devbox/.local/share/code-server /home/devbox/workspace
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=HOME="/home/devbox",USER="devbox"

[program:ttyd]
command=ttyd -p 7681 -W -P 5 -t fontSize=15 -t rendererType=canvas -t disableLeaveAlert=true -t 'theme={"background": "#181825", "foreground": "#cdd6f4", "cursor": "#f5e0dc", "selectionBackground": "#585b70"}' /bin/bash -l
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
directory=/home/devbox
environment=HOME="/home/devbox",USER="devbox",TERM="xterm-256color"
